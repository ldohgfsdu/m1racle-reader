note: >
  Markdown relative image resolution V1. Capability tiers:
  AppOwnedDirectory / FileDirectory support relative images within sandbox root.
  SafTreeDirectory only when a verified directory capability exists (no URI guessing).
  SingleContentDocument relative images → Inaccessible (controlled failure).
  No OpenDocumentTree UI, no schema change, no H1/PDF/tile changes.
product_semantics:
  absolute_uris_passthrough:
    - http
    - https
    - data
    - file
    - content
    - android.resource
  relative_supported_when:
    - AppOwnedDirectory
    - FileDirectory
    - SafTreeDirectory_with_verified_root
  relative_inaccessible_when:
    - SingleContentDocument
    - Unknown
    - external_open_single_file_grant
ui_failure:
