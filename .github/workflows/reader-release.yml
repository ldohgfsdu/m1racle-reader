name: Reader signed release

on:
  pull_request:
    branches: [master]
    paths:
      - ".github/workflows/reader-release.yml"
      - "tools/release_gate.py"
      - "tools/publish_reader_release.sh"
      - "tools/tests/test_release_gate.py"
      - "app/version.properties"
      - "docs/releases/**"
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish app/version.properties from master after full signed checks"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: reader-public-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Verify version metadata and negative controls
        run: |
          python3 -m unittest discover -s tools/tests -p 'test_release_gate.py' -v
          python3 tools/release_gate.py identity
          bash -n tools/publish_reader_release.sh

  publish:
    if: >-
      github.ref == 'refs/heads/master' &&
      ((github.event_name == 'workflow_dispatch' && inputs.publish) ||
       (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish]')))
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      KEYSTORE_B64: ${{ secrets.M1RACLE_RELEASE_KEYSTORE_BASE64 }}
      M1RACLE_RELEASE_STORE_PASSWORD: ${{ secrets.M1RACLE_RELEASE_STORE_PASSWORD }}
      M1RACLE_RELEASE_KEY_ALIAS: ${{ secrets.M1RACLE_RELEASE_KEY_ALIAS }}
      M1RACLE_RELEASE_KEY_PASSWORD: ${{ secrets.M1RACLE_RELEASE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install Reader Android SDK
        shell: bash
        run: |
          set -euo pipefail
          manager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$manager"
          "$manager" "platforms;android-37.0" "build-tools;36.0.0" --channel=3
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Run tests, sign, validate, upload and read back APK before publish
        shell: bash
        run: bash tools/publish_reader_release.sh
      - name: Preserve logs and QA/Lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-public-release-evidence-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            app/build/test-results/
            app/build/reports/tests/
            app/build/reports/lint-results-release.*
            app/build/outputs/logs/
