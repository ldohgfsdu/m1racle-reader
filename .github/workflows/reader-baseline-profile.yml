name: Reader baseline profile

# Generates app/src/main/baseline-prof.txt on a real emulator. Reader has shipped
# without a baseline profile, so ART re-decides AOT/JIT state on every cold start.
# A device is required: BaselineProfileRule measures real execution, so this cannot
# run on a normal CI host and is not part of the per-PR gate.
#
# Output is an artifact; promoting it means copying baseline-prof.txt into
# app/src/main/ and committing, because the profile must be reviewed like code.

on:
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 1"
  # Bootstrap trigger: GitHub only exposes workflow_dispatch for workflows that
  # exist on the default branch. Until this file lands on master, a push that
  # touches the generator or this workflow runs it. Remove once merged.
  push:
    branches: [chore/deps-prune-20261108]
    paths:
      - ".github/workflows/reader-baseline-profile.yml"
      - "benchmark/build.gradle.kts"
      - "benchmark/src/main/java/com/m1racle/reader/benchmark/BaselineProfileGenerator.kt"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
      - name: Install exact Android SDK requirements
        shell: bash
        run: |
          set -euo pipefail
          manager=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          test -x "$manager"
          "$manager" "platforms;android-37.0" "build-tools;36.0.0" --channel=3
          printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties
          chmod +x gradlew
      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Generate the baseline profile on an API 35 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -eu
            ./gradlew :benchmark:connectedBenchmarkAndroidTest --no-daemon --max-workers=1 --console=plain "-Pandroid.testInstrumentationRunnerArguments.class=com.m1racle.reader.benchmark.BaselineProfileGenerator" "-Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.suppressErrors=EMULATOR" "-Dorg.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=1024m -XX:ReservedCodeCacheSize=256m -XX:+UseSerialGC -Dfile.encoding=UTF-8"
      - name: Locate the generated profile
        if: always()
        run: find . -name "baseline-prof*.txt" -newermt "-3 hours" -print -exec wc -l {} \;
      - name: Preserve the profile and benchmark reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-baseline-profile-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            benchmark/build/outputs/**
            app/build/outputs/**
