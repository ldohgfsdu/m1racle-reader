org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# aapt2 override (arm64 hosts run the x86_64 SDK aapt2 under qemu via the
# tools/aapt2 wrapper, which resolves the real SDK binary per host). The path
# is resolved relative to each module directory (AGP behavior), hence ../tools.
# AGP reads this key directly from gradle.properties files; a machine-local
# value in ~/.gradle/gradle.properties wins over this project file, so hosts
# with an outdated global override should remove it. Fresh clones build as-is.
android.aapt2FromMavenOverride=../tools/aapt2
android.suppressUnsupportedCompileSdk=36,37
