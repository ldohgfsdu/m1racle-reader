org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Windows and x86 hosts use AGP's platform-native aapt2. ARM/qemu hosts can
# opt in using a machine-local ~/.gradle/gradle.properties entry pointing to
# tools/aapt2; never impose a Unix executable on every checkout.
