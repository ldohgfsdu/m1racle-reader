org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=384m -XX:ReservedCodeCacheSize=128m -XX:+UseSerialGC -Dfile.encoding=UTF-8
org.gradle.workers.max=1
org.gradle.parallel=false
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Windows and x86 hosts use AGP's platform-native aapt2. ARM/qemu hosts can
# opt in using a machine-local ~/.gradle/gradle.properties entry pointing to
# their own aapt2 wrapper; never impose a Unix executable on every checkout.
